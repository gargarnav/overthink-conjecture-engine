[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "overthink"
version = "0.1.0"
description = "Falsification-first conjecture discovery for combinatorial game theory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arnav Garg" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "pyyaml>=6.0.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
overthink = "overthink.cli:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "overthink._core"
features = ["pyo3/extension-module"]

[tool.uv]
# Rebuild the Rust extension whenever Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/overthink"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["overthink"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Committed experiment artifacts are kept byte-identical to what was run.
extend-exclude = ["experiments/familyH/write_proposals.py"]
