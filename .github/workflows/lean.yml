name: Lean

on:
  push:
    paths: ["lean/**", ".github/workflows/lean.yml"]
  pull_request:
    paths: ["lean/**", ".github/workflows/lean.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: Axiom check (no sorry, no native_decide)
        working-directory: lean
        run: |
          lake env lean CheckAxioms.lean | tee axioms.txt
          ! grep -E "sorryAx|ofReduceBool" axioms.txt
