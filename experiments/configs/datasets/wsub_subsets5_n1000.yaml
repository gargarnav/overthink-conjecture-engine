dataset: wsub_subsets5_n1000
family: wythoff_subtraction
description: >-
  Grundy values of the Wythoff subtraction game W(S) for every non-empty S contained in
  {1, ..., 5} (31 sets) and all positions with x, y < 1000. Family H (new game family) of the
  project; proposal window x, y < 100, falsification on the full table (10x).
motivation: >-
  Grundy values of the Wythoff subtraction games W(S), a family of finite two-dimensional subtraction games used for the AI-proposer experiment (family H).
limitations: >-
  Only S within {1..5} and x, y < 1000; most structure is periodic, which may make this family easier than typical 2D subtraction games.
params:
  all_subsets_of: 5
  n: 1000
