site_name: Overthink Conjecture Engine
site_url: https://gargarnav.github.io/overthink-conjecture-engine/
repo_url: https://github.com/gargarnav/overthink-conjecture-engine
repo_name: gargarnav/overthink-conjecture-engine
site_author: Arnav Garg
# Footer. If funding.yaml is switched to funded: true, add the acknowledgment here.
copyright: "Code MIT · Data CC BY 4.0 · © 2026 Arnav Garg"
theme:
  name: material
  features: [navigation.sections, content.code.copy]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions: [tables, admonition, pymdownx.superfences]
nav:
  - Home: index.md
  - Methodology: methodology.md
  - Architecture: architecture.md
  - Results:
      - Results log: results_log.md
      - "W({a,a+1}) theorem": results/W_pair_theorem.md
      - Metrics: metrics.md
      - Costs: costs.md
  - Commit SHA map: commit_sha_map.md
