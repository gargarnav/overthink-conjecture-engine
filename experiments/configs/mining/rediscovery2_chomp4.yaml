# Rediscovery run 2 on 4-row Chomp (pre-registered; see experiments/rediscovery2/PROTOCOL.md).
# NOT blind: the ground truth and run 1's results are known. Changes from run 1, and only these:
#   1. functional dependencies are emitted as conjectures (run-1 lesson 1);
#   2. proposal window a <= 300 instead of a <= 100 (run-1 lesson 3); falsification at a <= 3000 (10x);
#   3. groups (c, d) up to 60 instead of 30, to allow second-order statements over longer runs.
# Dataset chomp4_a3000_c60 contains every row that grouped views with max_group_value <= 60 read.
run_name: rediscovery2_chomp4
datasets:
  - id: chomp4_a3000_c60
    proposal_window: {a: 300}
views:
  max_group_value: 60
  min_length: 30
  transforms: [raw, minus_index]
  zero_set: true
  enumeration: true
  max_sequences: 50000
miners:
  structural_transforms: [raw]
  functional_dependencies: {enabled: true}
  periodic: {max_period: 200, min_repeats: 3, min_support: 20, min_tail_fraction: 0.0}
  polynomial: {max_degree: 4, max_modulus: 6, min_support: 20}
  recurrence: {max_order: 12, min_support: 20}
  floor_linear: {min_points: 30, max_points: 3000}
  oeis: {snapshot: null, min_terms: 12, max_hits: 10}
second_order:
  enabled: true
  min_length: 12
  miners:
    structural_transforms: [raw]
    periodic: {max_period: 50, min_repeats: 3, min_support: 8}
    polynomial: {max_degree: 3, max_modulus: 4, min_support: 8}
    recurrence: {max_order: 6, min_support: 8}
    floor_linear: {min_points: 12, max_points: 3000}
